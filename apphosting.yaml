# apphosting.yaml
# https://firebase.google.com/docs/app-hosting/configure :contentReference[oaicite:4]{index=4}

runConfig:
  maxInstances: 1

cors:
  - origin: "*"
    method: ["GET", "HEAD"]

# Environment variables for the App Hosting backend.
# Use Secret Manager references for sensitive values. :contentReference[oaicite:5]{index=5}
env:
  - variable: FIREBASE_SERVICE_ACCOUNT_JSON
    secret: FIREBASE_SERVICE_ACCOUNT_JSON
    availability:
      - RUNTIME
